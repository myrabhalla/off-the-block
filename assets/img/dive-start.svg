<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="diveTitle diveDesc">
  <title id="diveTitle">A swimmer diving off the blocks at a competition, seen from above</title>
  <desc id="diveDesc">An overhead view of the start end of a competition pool. Six numbered starting blocks line the deck. In the centre lane a female swimmer in a dark racing suit and coral cap is mid-dive, streamlined with her arms extended and her hands breaking the water in a burst of white foam. Swimmers in the neighbouring lanes are taking off a fraction behind her.</desc>

  <defs>
    <linearGradient id="dv-water" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#57b0f4"/>
      <stop offset="0.45" stop-color="#3d97e8"/>
      <stop offset="1" stop-color="#2278cd"/>
    </linearGradient>
  </defs>

  <!-- water -->
  <rect width="800" height="460" fill="url(#dv-water)"/>

  <g>
    <path d="M-40 150c150 26 300-18 460 10s260 6 420-16v120C680 292 520 246 340 274S60 314-40 288z" fill="#6cbcf7" opacity="0.2"/>
    <path d="M-40 380c180-30 340 26 520 4s180 8 360 30v70H-40z" fill="#1b62b8" opacity="0.24"/>
  </g>

  <!-- sunlight caustics -->
  <g fill="none" stroke="#eaf7ff" stroke-linecap="round">
    <path d="M40 210c70-14 120 12 190 2s120-18 190-6" stroke-width="5" opacity="0.3"/>
    <path d="M420 330c80-14 150 12 230 0" stroke-width="5" opacity="0.28"/>
    <path d="M60 400c90-16 150 12 240 0s150-16 230-4" stroke-width="4" opacity="0.24"/>
  </g>

  <!-- the deck -->
  <g>
    <rect x="-20" y="-20" width="840" height="118" fill="#e3f4fe"/>
    <rect x="-20" y="86" width="840" height="14" fill="#cfeafd"/>
    <!-- the tiled edge the blocks bolt onto -->
    <rect x="-20" y="98" width="840" height="9" fill="#0b2a52" opacity="0.6"/>
  </g>

  <!-- six starting blocks -->
  <g stroke="#0b2a52" stroke-width="4" stroke-linejoin="round">
    <g>
      <rect x="35" y="26" width="90" height="70" rx="12" fill="#0b2a52"/>
      <rect x="47" y="38" width="66" height="34" rx="8" fill="#f2fafe"/>
      <rect x="60" y="76" width="40" height="12" rx="6" fill="#2b8ad4"/>
    </g>
    <g>
      <rect x="165" y="26" width="90" height="70" rx="12" fill="#0b2a52"/>
      <rect x="177" y="38" width="66" height="34" rx="8" fill="#f2fafe"/>
      <rect x="190" y="76" width="40" height="12" rx="6" fill="#2b8ad4"/>
    </g>
    <g>
      <rect x="295" y="26" width="90" height="70" rx="12" fill="#0b2a52"/>
      <rect x="307" y="38" width="66" height="34" rx="8" fill="#f2fafe"/>
      <rect x="320" y="76" width="40" height="12" rx="6" fill="#2b8ad4"/>
    </g>
    <!-- her block: the one she has just left -->
    <g>
      <rect x="425" y="26" width="90" height="70" rx="12" fill="#0b2a52"/>
      <rect x="437" y="38" width="66" height="34" rx="8" fill="#ffe4d8"/>
      <rect x="450" y="76" width="40" height="12" rx="6" fill="#f26b3a"/>
    </g>
    <g>
      <rect x="555" y="26" width="90" height="70" rx="12" fill="#0b2a52"/>
      <rect x="567" y="38" width="66" height="34" rx="8" fill="#f2fafe"/>
      <rect x="580" y="76" width="40" height="12" rx="6" fill="#2b8ad4"/>
    </g>
    <g>
      <rect x="685" y="26" width="90" height="70" rx="12" fill="#0b2a52"/>
      <rect x="697" y="38" width="66" height="34" rx="8" fill="#f2fafe"/>
      <rect x="710" y="76" width="40" height="12" rx="6" fill="#2b8ad4"/>
    </g>
  </g>

  <!-- lane numbers, painted onto the block tops -->
  <g font-family="Gabarito, Verdana, sans-serif" font-size="21" font-weight="700" fill="#0b2a52" text-anchor="middle">
    <text x="80" y="62">2</text>
    <text x="210" y="62">3</text>
    <text x="340" y="62">4</text>
    <text x="470" y="62" fill="#9c3612">5</text>
    <text x="600" y="62">6</text>
    <text x="730" y="62">7</text>
  </g>

  <!-- lane ropes, running away from the blocks -->
  <g fill="none" stroke-linecap="butt">
    <g stroke="#0b2a52" stroke-width="19" opacity="0.35">
      <path d="M130 108v370"/><path d="M260 108v370"/><path d="M390 108v370"/>
      <path d="M520 108v370"/><path d="M650 108v370"/>
    </g>
    <g stroke-width="15">
      <path d="M130 108v370" stroke="#ffffff" stroke-dasharray="26 26"/>
      <path d="M130 108v370" stroke="#f26b3a" stroke-dasharray="26 26" stroke-dashoffset="26"/>
      <path d="M260 108v370" stroke="#ffffff" stroke-dasharray="26 26"/>
      <path d="M260 108v370" stroke="#f26b3a" stroke-dasharray="26 26" stroke-dashoffset="26"/>
      <path d="M390 108v370" stroke="#ffffff" stroke-dasharray="26 26"/>
      <path d="M390 108v370" stroke="#f26b3a" stroke-dasharray="26 26" stroke-dashoffset="26"/>
      <path d="M520 108v370" stroke="#ffffff" stroke-dasharray="26 26"/>
      <path d="M520 108v370" stroke="#f26b3a" stroke-dasharray="26 26" stroke-dashoffset="26"/>
      <path d="M650 108v370" stroke="#ffffff" stroke-dasharray="26 26"/>
      <path d="M650 108v370" stroke="#f26b3a" stroke-dasharray="26 26" stroke-dashoffset="26"/>
    </g>
  </g>

  <!--
    The figures. Each limb is stroked twice — a wider navy contour, then the
    skin or suit colour over it — and the parts are drawn back to front, so a
    nearer limb crops the outline of the one behind it. No filters: an SVG
    filter is rasterised before it reaches the screen, which is exactly what
    was softening these edges before.
  -->

  <!-- lane 4, still tight off the block -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="347" cy="205" rx="24" ry="34" fill="#0b2a52" opacity="0.18"/>
    <g fill="none">
      <path d="M330 132v44M350 132v44" stroke="#0b2a52" stroke-width="24"/>
      <path d="M330 132v44M350 132v44" stroke="#e0a87f" stroke-width="17"/>
    </g>
    <g stroke="#0b2a52" stroke-width="3.5">
      <ellipse cx="330" cy="123" rx="8.5" ry="12" fill="#e0a87f"/>
      <ellipse cx="350" cy="123" rx="8.5" ry="12" fill="#e0a87f"/>
    </g>
    <path d="M340 178v54" fill="none" stroke="#0b2a52" stroke-width="53"/>
    <path d="M340 178v54" fill="none" stroke="#0a2247" stroke-width="46"/>
    <path d="M340 186v40" fill="none" stroke="#1c4585" stroke-width="24"/>
    <g fill="none">
      <path d="M328 262v34M352 262v34" stroke="#0b2a52" stroke-width="22"/>
      <path d="M328 262v34M352 262v34" stroke="#e8b78e" stroke-width="15"/>
    </g>
    <circle cx="340" cy="248" r="19" fill="#f2fafe" stroke="#0b2a52" stroke-width="3.5"/>
    <path d="M325 237a19 19 0 0 1 28 3" fill="#ffc7ab" stroke="#0b2a52" stroke-width="2.5"/>
    <g fill="#ffffff" stroke="#2278cd" stroke-width="2.5">
      <ellipse cx="340" cy="306" rx="26" ry="12"/>
      <circle cx="316" cy="318" r="7"/>
      <circle cx="364" cy="316" r="6"/>
    </g>
  </g>

  <!-- lane 6, further back again -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="607" cy="195" rx="23" ry="32" fill="#0b2a52" opacity="0.18"/>
    <g fill="none">
      <path d="M591 126v42M609 126v42" stroke="#0b2a52" stroke-width="23"/>
      <path d="M591 126v42M609 126v42" stroke="#c98d63" stroke-width="16"/>
    </g>
    <g stroke="#0b2a52" stroke-width="3.5">
      <ellipse cx="591" cy="117" rx="8" ry="11.5" fill="#c98d63"/>
      <ellipse cx="609" cy="117" rx="8" ry="11.5" fill="#c98d63"/>
    </g>
    <path d="M600 170v50" fill="none" stroke="#0b2a52" stroke-width="51"/>
    <path d="M600 170v50" fill="none" stroke="#0a2247" stroke-width="44"/>
    <path d="M600 178v36" fill="none" stroke="#1c4585" stroke-width="22"/>
    <g fill="none">
      <path d="M589 250v32M611 250v32" stroke="#0b2a52" stroke-width="21"/>
      <path d="M589 250v32M611 250v32" stroke="#d59c72" stroke-width="14"/>
    </g>
    <circle cx="600" cy="236" r="18" fill="#8fcbf5" stroke="#0b2a52" stroke-width="3.5"/>
    <path d="M586 226a18 18 0 0 1 27 3" fill="#e3ab7e" stroke="#0b2a52" stroke-width="2.5"/>
    <g fill="#ffffff" stroke="#2278cd" stroke-width="2.5">
      <ellipse cx="600" cy="292" rx="24" ry="11"/>
      <circle cx="624" cy="302" r="6.5"/>
      <circle cx="578" cy="300" r="5.5"/>
    </g>
  </g>

  <!-- ================= the swimmer, lane 5, leading ================= -->

  <!-- her shadow on the water: crisp, and kept behind the torso so it never
       shows through the gap between her arms -->
  <ellipse cx="478" cy="200" rx="26" ry="46" fill="#0b2a52" opacity="0.2"/>

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- legs together, toes still pointed back at the block -->
    <g fill="none">
      <path d="M461 118v40M479 118v40" stroke="#0b2a52" stroke-width="25"/>
      <path d="M461 118v40M479 118v40" stroke="#e0a87f" stroke-width="18"/>
    </g>
    <g stroke="#0b2a52" stroke-width="3.5">
      <ellipse cx="461" cy="108" rx="9" ry="13" fill="#e0a87f"/>
      <ellipse cx="479" cy="108" rx="9" ry="13" fill="#e0a87f"/>
    </g>

    <!-- the racing suit: high back, cut to the thigh -->
    <path d="M470 158v78" fill="none" stroke="#0b2a52" stroke-width="57"/>
    <path d="M470 158v78" fill="none" stroke="#0a2247" stroke-width="50"/>
    <path d="M470 166v62" fill="none" stroke="#1c4585" stroke-width="28"/>
    <!-- a coral seam down the spine of the suit -->
    <path d="M470 164v66" fill="none" stroke="#f26b3a" stroke-width="5"/>

    <!-- arms in a streamline, hands locked, breaking the surface -->
    <g fill="none">
      <path d="M446 234L438 302L460 338" stroke="#0b2a52" stroke-width="23"/>
      <path d="M494 234L502 302L480 338" stroke="#0b2a52" stroke-width="23"/>
      <path d="M446 234L438 302L460 338" stroke="#e8b78e" stroke-width="16"/>
      <path d="M494 234L502 302L480 338" stroke="#e8b78e" stroke-width="16"/>
    </g>
    <!-- the locked hands -->
    <path d="M452 336h36" fill="none" stroke="#0b2a52" stroke-width="21"/>
    <path d="M452 336h36" fill="none" stroke="#e8b78e" stroke-width="14"/>
    <path d="M470 330v12" fill="none" stroke="#0b2a52" stroke-width="2.5" opacity="0.6"/>

    <!-- head in a coral cap, tucked between the arms -->
    <circle cx="470" cy="262" r="25" fill="#f26b3a" stroke="#0b2a52" stroke-width="4"/>
    <path d="M450 250a25 25 0 0 1 37 3" fill="#ffc7ab" stroke="#0b2a52" stroke-width="2.5"/>
    <!-- goggle strap, seen from behind the head -->
    <path d="M446 266h48" fill="none" stroke="#0b2a52" stroke-width="5"/>
    <circle cx="470" cy="278" r="7" fill="#0b2a52" opacity="0.55"/>
  </g>

  <!-- the entry: foam opening up around her hands -->
  <g fill="#ffffff" stroke="#2278cd" stroke-width="2.5">
    <ellipse cx="470" cy="354" rx="44" ry="21"/>
    <ellipse cx="470" cy="376" rx="28" ry="13"/>
    <circle cx="422" cy="362" r="11"/>
    <circle cx="518" cy="360" r="10"/>
    <circle cx="444" cy="390" r="8"/>
    <circle cx="498" cy="394" r="7"/>
    <circle cx="470" cy="408" r="6"/>
  </g>

  <!-- spray still hanging where she left the block, thrown clear of her feet
       so her pointed toes stay readable against the deck edge -->
  <g fill="#ffffff" stroke="#8fcbf5" stroke-width="2.5">
    <ellipse cx="437" cy="120" rx="14" ry="8"/>
    <ellipse cx="504" cy="118" rx="13" ry="7.5"/>
    <circle cx="418" cy="134" r="6"/>
    <circle cx="524" cy="132" r="5.5"/>
  </g>
</svg>

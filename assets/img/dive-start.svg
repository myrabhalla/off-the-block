<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" role="img" aria-labelledby="diveTitle diveDesc">
  <title id="diveTitle">A swimmer diving off the blocks at a competition, seen from above</title>
  <desc id="diveDesc">An overhead view of the start end of a competition pool. Six numbered starting blocks line the deck. In the centre lane a female swimmer in a dark racing suit and coral cap is mid-dive, streamlined with her arms extended and her hands breaking the water in a burst of white foam. Swimmers in the neighbouring lanes are taking off a fraction behind her.</desc>

  <defs>
    <linearGradient id="dv-water" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#57b0f4"/>
      <stop offset="0.45" stop-color="#3d97e8"/>
      <stop offset="1" stop-color="#2278cd"/>
    </linearGradient>

    <!-- A light wobble: enough to soften a vector edge, not enough to blur it. -->
    <filter id="dv-brush" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.019" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="dv-fine" x="-12%" y="-12%" width="124%" height="124%">
      <feTurbulence type="fractalNoise" baseFrequency="0.055" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="dv-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- water -->
  <rect width="800" height="460" fill="url(#dv-water)"/>

  <g filter="url(#dv-brush)">
    <path d="M-40 150c150 26 300-18 460 10s260 6 420-16v120C680 292 520 246 340 274S60 314-40 288z" fill="#6cbcf7" opacity="0.2"/>
    <path d="M-40 380c180-30 340 26 520 4s180 8 360 30v70H-40z" fill="#1b62b8" opacity="0.24"/>
  </g>

  <!-- sunlight caustics -->
  <g filter="url(#dv-fine)" fill="none" stroke="#eaf7ff" stroke-linecap="round">
    <path d="M40 210c70-14 120 12 190 2s120-18 190-6" stroke-width="5" opacity="0.22"/>
    <path d="M420 330c80-14 150 12 230 0" stroke-width="5" opacity="0.2"/>
    <path d="M60 400c90-16 150 12 240 0s150-16 230-4" stroke-width="4" opacity="0.18"/>
  </g>

  <!-- the deck -->
  <g filter="url(#dv-fine)">
    <rect x="-20" y="-20" width="840" height="118" fill="#e3f4fe"/>
    <rect x="-20" y="86" width="840" height="14" fill="#cfeafd"/>
    <!-- the tiled edge the blocks bolt onto -->
    <rect x="-20" y="98" width="840" height="9" fill="#0b2a52" opacity="0.5"/>
  </g>

  <!-- six starting blocks -->
  <g filter="url(#dv-fine)">
    <g>
      <rect x="35" y="26" width="90" height="70" rx="12" fill="#0b2a52"/>
      <rect x="47" y="38" width="66" height="34" rx="8" fill="#f2fafe" opacity="0.9"/>
      <rect x="60" y="76" width="40" height="12" rx="6" fill="#2b8ad4"/>
    </g>
    <g>
      <rect x="165" y="26" width="90" height="70" rx="12" fill="#0b2a52"/>
      <rect x="177" y="38" width="66" height="34" rx="8" fill="#f2fafe" opacity="0.9"/>
      <rect x="190" y="76" width="40" height="12" rx="6" fill="#2b8ad4"/>
    </g>
    <g>
      <rect x="295" y="26" width="90" height="70" rx="12" fill="#0b2a52"/>
      <rect x="307" y="38" width="66" height="34" rx="8" fill="#f2fafe" opacity="0.9"/>
      <rect x="320" y="76" width="40" height="12" rx="6" fill="#2b8ad4"/>
    </g>
    <!-- her block: the one she has just left -->
    <g>
      <rect x="425" y="26" width="90" height="70" rx="12" fill="#0b2a52"/>
      <rect x="437" y="38" width="66" height="34" rx="8" fill="#ffe4d8"/>
      <rect x="450" y="76" width="40" height="12" rx="6" fill="#f26b3a"/>
    </g>
    <g>
      <rect x="555" y="26" width="90" height="70" rx="12" fill="#0b2a52"/>
      <rect x="567" y="38" width="66" height="34" rx="8" fill="#f2fafe" opacity="0.9"/>
      <rect x="580" y="76" width="40" height="12" rx="6" fill="#2b8ad4"/>
    </g>
    <g>
      <rect x="685" y="26" width="90" height="70" rx="12" fill="#0b2a52"/>
      <rect x="697" y="38" width="66" height="34" rx="8" fill="#f2fafe" opacity="0.9"/>
      <rect x="710" y="76" width="40" height="12" rx="6" fill="#2b8ad4"/>
    </g>
  </g>

  <!-- lane numbers, painted onto the block tops -->
  <g font-family="Gabarito, Verdana, sans-serif" font-size="21" font-weight="700" fill="#0b2a52" text-anchor="middle">
    <text x="80" y="62">2</text>
    <text x="210" y="62">3</text>
    <text x="340" y="62">4</text>
    <text x="470" y="62" fill="#9c3612">5</text>
    <text x="600" y="62">6</text>
    <text x="730" y="62">7</text>
  </g>

  <!-- lane ropes, running away from the blocks -->
  <g filter="url(#dv-fine)" fill="none" stroke-linecap="butt">
    <g stroke-width="15">
      <path d="M130 108v370" stroke="#ffffff" stroke-dasharray="26 26"/>
      <path d="M130 108v370" stroke="#f26b3a" stroke-dasharray="26 26" stroke-dashoffset="26"/>
      <path d="M260 108v370" stroke="#ffffff" stroke-dasharray="26 26"/>
      <path d="M260 108v370" stroke="#f26b3a" stroke-dasharray="26 26" stroke-dashoffset="26"/>
      <path d="M390 108v370" stroke="#ffffff" stroke-dasharray="26 26"/>
      <path d="M390 108v370" stroke="#f26b3a" stroke-dasharray="26 26" stroke-dashoffset="26"/>
      <path d="M520 108v370" stroke="#ffffff" stroke-dasharray="26 26"/>
      <path d="M520 108v370" stroke="#f26b3a" stroke-dasharray="26 26" stroke-dashoffset="26"/>
      <path d="M650 108v370" stroke="#ffffff" stroke-dasharray="26 26"/>
      <path d="M650 108v370" stroke="#f26b3a" stroke-dasharray="26 26" stroke-dashoffset="26"/>
    </g>
  </g>

  <!-- the field: two rivals, a beat behind -->
  <g opacity="0.9">
    <!-- lane 4, still tight off the block -->
    <g filter="url(#dv-soft)" opacity="0.2">
      <path d="M340 150v104" stroke="#0a2247" stroke-width="46" stroke-linecap="round" fill="none"/>
    </g>
    <g filter="url(#dv-fine)" fill="none" stroke-linecap="round">
      <path d="M330 132v44M350 132v44" stroke="#e0a87f" stroke-width="17"/>
      <path d="M340 178v54" stroke="#0a2247" stroke-width="46"/>
      <path d="M340 186v40" stroke="#123163" stroke-width="26" opacity="0.5"/>
      <circle cx="340" cy="248" r="19" fill="#ffffff"/>
      <path d="M326 236a19 19 0 0 1 26 3" fill="#ffc7ab" opacity="0.9"/>
      <path d="M328 262v34M352 262v34" stroke="#e8b78e" stroke-width="15"/>
    </g>
    <g filter="url(#dv-fine)" fill="#ffffff">
      <ellipse cx="340" cy="302" rx="27" ry="12" opacity="0.7"/>
      <circle cx="318" cy="312" r="6" opacity="0.45"/>
    </g>

    <!-- lane 6, further back again -->
    <g filter="url(#dv-soft)" opacity="0.2">
      <path d="M600 146v98" stroke="#0a2247" stroke-width="44" stroke-linecap="round" fill="none"/>
    </g>
    <g filter="url(#dv-fine)" fill="none" stroke-linecap="round">
      <path d="M591 126v42M609 126v42" stroke="#c98d63" stroke-width="16"/>
      <path d="M600 170v50" stroke="#0a2247" stroke-width="44"/>
      <path d="M600 178v36" stroke="#123163" stroke-width="24" opacity="0.5"/>
      <circle cx="600" cy="236" r="18" fill="#8fcbf5"/>
      <path d="M587 225a18 18 0 0 1 25 3" fill="#e3ab7e" opacity="0.9"/>
      <path d="M589 250v32M611 250v32" stroke="#d59c72" stroke-width="14"/>
    </g>
    <g filter="url(#dv-fine)" fill="#ffffff">
      <ellipse cx="600" cy="288" rx="25" ry="11" opacity="0.62"/>
      <circle cx="622" cy="298" r="6" opacity="0.4"/>
    </g>
  </g>

  <!-- ================= the swimmer, lane 5, leading ================= -->

  <!-- her shadow, thrown onto the water below her -->
  <g filter="url(#dv-soft)" opacity="0.28">
    <path d="M474 168v150" stroke="#0a2247" stroke-width="54" stroke-linecap="round" fill="none"/>
  </g>

  <!-- the flat water she is still travelling over, lit where she blocks the sun -->
  <ellipse cx="470" cy="250" rx="62" ry="130" fill="#bfe6ff" opacity="0.18" filter="url(#dv-soft)"/>

  <g filter="url(#dv-fine)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- feet and legs, together, toes still pointed back at the block -->
    <path d="M461 118v40M479 118v40" stroke="#e0a87f" stroke-width="18"/>

    <!-- the racing suit: high back, cut to the thigh -->
    <path d="M470 158v78" stroke="#0a2247" stroke-width="50"/>
    <path d="M470 166v62" stroke="#123163" stroke-width="30" opacity="0.55"/>
    <!-- a coral seam down the spine of the suit -->
    <path d="M470 164v66" stroke="#f26b3a" stroke-width="5" opacity="0.85"/>
  </g>

  <!-- arms in a streamline, hands locked, breaking the surface -->
  <g filter="url(#dv-fine)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M446 234L438 302L460 338" stroke="#e8b78e" stroke-width="16"/>
    <path d="M494 234L502 302L480 338" stroke="#e8b78e" stroke-width="16"/>
    <path d="M460 342h20" stroke="#e8b78e" stroke-width="14"/>
  </g>

  <!-- head in a coral cap, tucked between the arms -->
  <g filter="url(#dv-fine)">
    <circle cx="470" cy="262" r="25" fill="#f26b3a"/>
    <path d="M451 249a25 25 0 0 1 34 3a25 25 0 0 0-34-3z" fill="#ffc7ab" opacity="0.95"/>
    <!-- goggles, seen from behind the head -->
    <path d="M447 264h46" stroke="#0a2247" stroke-width="5" opacity="0.55" fill="none"/>
    <circle cx="470" cy="278" r="7" fill="#0a2247" opacity="0.4"/>
  </g>

  <!-- the entry: foam opening up around her hands -->
  <g filter="url(#dv-fine)" fill="#ffffff">
    <ellipse cx="470" cy="352" rx="46" ry="22" opacity="0.9"/>
    <ellipse cx="470" cy="372" rx="30" ry="14" opacity="0.6"/>
    <circle cx="425" cy="360" r="11" opacity="0.7"/>
    <circle cx="515" cy="358" r="10" opacity="0.66"/>
    <circle cx="446" cy="386" r="8" opacity="0.5"/>
    <circle cx="497" cy="390" r="7" opacity="0.45"/>
    <circle cx="470" cy="404" r="6" opacity="0.35"/>
  </g>

  <!-- spray still hanging where she left the block -->
  <g filter="url(#dv-fine)" fill="#ffffff">
    <ellipse cx="470" cy="116" rx="24" ry="9" opacity="0.5"/>
    <circle cx="443" cy="124" r="6" opacity="0.4"/>
    <circle cx="498" cy="122" r="5" opacity="0.35"/>
  </g>
</svg>

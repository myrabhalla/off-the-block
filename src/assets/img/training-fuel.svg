<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="fuelTitle fuelDesc">
  <title id="fuelTitle">A pre-training breakfast laid out from above</title>
  <desc id="fuelDesc">A flat-lay illustration of a typical pre-training meal: a bowl of porridge topped with banana slices and berries, a slice of toast with honey, a glass of milk, a whole banana, a spoon and a water bottle.</desc>

  <rect width="800" height="360" fill="#e3f4fe"/>

  <!-- a few loose brush marks so the surface is not flat white -->
  <g opacity="0.5">
    <path d="M-20 60c160-22 300 30 480 6s200 4 360 22" fill="none" stroke="#cfeafd" stroke-width="26"/>
    <path d="M-20 300c180-24 320 26 500 4s180 6 360 24" fill="none" stroke="#cfeafd" stroke-width="30"/>
  </g>

  <!-- the porridge bowl -->
  <g>
    <ellipse cx="222" cy="200" rx="104" ry="102" fill="#0b2a52" opacity="0.14"/>
    <g>
      <circle cx="216" cy="192" r="100" fill="#ffffff" stroke="#0b2a52" stroke-width="4"/>
      <circle cx="216" cy="192" r="80" fill="#f6ead2"/>
      <circle cx="216" cy="192" r="80" fill="#e8d3ae" opacity="0.45"/>

      <!-- banana slices -->
      <g stroke="#0b2a52" stroke-width="3">
        <circle cx="180" cy="160" r="19" fill="#f8dc7c"/>
        <circle cx="228" cy="146" r="17" fill="#f8dc7c"/>
        <circle cx="256" cy="188" r="18" fill="#f8dc7c"/>
        <circle cx="196" cy="214" r="16" fill="#f8dc7c"/>
      </g>
      <g fill="#e6c463">
        <circle cx="180" cy="160" r="5"/>
        <circle cx="228" cy="146" r="4.5"/>
        <circle cx="256" cy="188" r="5"/>
        <circle cx="196" cy="214" r="4"/>
      </g>

      <!-- berries -->
      <g fill="#cf4664" stroke="#0b2a52" stroke-width="3">
        <circle cx="244" cy="228" r="13"/>
        <circle cx="212" cy="248" r="11"/>
        <circle cx="168" cy="206" r="10"/>
        <circle cx="254" cy="120" r="9"/>
      </g>
      <g fill="#a8324c" opacity="0.55">
        <circle cx="240" cy="224" r="4"/>
        <circle cx="209" cy="245" r="3.5"/>
      </g>

      <!-- a drizzle of honey -->
      <path d="M156 236c26 14 54-6 82 4s44 20 62 8" fill="none" stroke="#f0a93c" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    </g>
  </g>

  <!-- spoon -->
  <g>
    <ellipse cx="372" cy="126" rx="21" ry="27" fill="#ffffff" stroke="#0b2a52" stroke-width="3.5" transform="rotate(18 372 126)"/>
    <path d="M382 152l30 88" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M382 152l30 88" stroke="#0b2a52" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.55"/>
  </g>

  <!-- toast with honey -->
  <g>
    <rect x="452" y="60" width="150" height="128" rx="26" fill="#0b2a52" opacity="0.13"/>
    <g>
      <path d="M448 84c0-20 16-32 40-32h66c24 0 40 12 40 32v72c0 18-14 30-34 30h-78c-20 0-34-12-34-30z" fill="#e8c78f" stroke="#0b2a52" stroke-width="4"/>
      <path d="M462 92c0-13 11-22 28-22h56c17 0 28 9 28 22v58c0 12-9 20-24 20h-64c-15 0-24-8-24-20z" fill="#f4dcae"/>
      <path d="M478 108c22 10 40-6 62 2s28 22 46 14" fill="none" stroke="#f0a93c" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
      <path d="M478 138c22 10 40-6 62 2s28 22 46 14" fill="none" stroke="#f0a93c" stroke-width="7" stroke-linecap="round" opacity="0.72"/>
    </g>
  </g>

  <!-- glass of milk, seen from above -->
  <g>
    <ellipse cx="470" cy="272" rx="56" ry="55" fill="#0b2a52" opacity="0.13"/>
    <g>
      <circle cx="466" cy="266" r="54" fill="#ffffff" stroke="#0b2a52" stroke-width="4"/>
      <circle cx="466" cy="266" r="40" fill="#f7fbff"/>
      <circle cx="466" cy="266" r="40" fill="#cfeafd" opacity="0.5"/>
      <path d="M440 250c14-8 30-8 44 0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    </g>
  </g>

  <!-- banana -->
  <g>
    <path d="M64 316c32 24 86 28 124 2" fill="none" stroke="#0b2a52" stroke-width="42" stroke-linecap="round" opacity="0.12"/>
    <path d="M60 310c32 24 86 28 124 2" fill="none" stroke="#f8dc7c" stroke-width="38" stroke-linecap="round"/>
    <path d="M60 310c32 24 86 28 124 2" fill="none" stroke="#0b2a52" stroke-width="3.5" stroke-linecap="round" opacity="0.35" stroke-dasharray="0 0"/>
    <path d="M76 324c28 18 72 20 102 0" fill="none" stroke="#e0b33f" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    <path d="M188 312l16-12" stroke="#5c7a2e" stroke-width="12" stroke-linecap="round" fill="none"/>
  </g>

  <!-- water bottle -->
  <g>
    <rect x="646" y="188" width="86" height="152" rx="34" fill="#0b2a52" opacity="0.13"/>
    <g>
      <rect x="640" y="180" width="86" height="152" rx="34" fill="#ffffff" stroke="#0b2a52" stroke-width="4"/>
      <rect x="656" y="222" width="54" height="94" rx="22" fill="#8fcbf5" opacity="0.75"/>
      <rect x="662" y="146" width="42" height="42" rx="14" fill="#f26b3a" stroke="#0b2a52" stroke-width="4"/>
      <path d="M668 244c10 8 22 8 32 0" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    </g>
  </g>

  <!-- a few oats scattered on the surface -->
  <g fill="#e8d3ae" stroke="#0b2a52" stroke-width="2.5">
    <ellipse cx="352" cy="300" rx="9" ry="6" transform="rotate(20 352 300)"/>
    <ellipse cx="380" cy="322" rx="8" ry="5" transform="rotate(-14 380 322)"/>
    <ellipse cx="330" cy="60" rx="8" ry="5" transform="rotate(32 330 60)"/>
    <ellipse cx="614" cy="88" rx="9" ry="6" transform="rotate(-24 614 88)"/>
  </g>
</svg>
